# Fixed distribution signing key for esp32-devkitc-flasher.
#
# The keystore in this directory is intentionally published so that every
# release build is signed with the same key and users can upgrade in place
# (SPEC §7). It protects update compatibility, not the identity of the build:
# anyone with the repository can sign an APK with it, so the app never trusts
# an APK just because the signature matches - the in-app updater only installs
# what the Android installer accepts after the user confirms.
#
# Override these values with the ESP32_FLASHER_STORE_FILE /
# ESP32_FLASHER_STORE_PASSWORD / ESP32_FLASHER_KEY_ALIAS /
# ESP32_FLASHER_KEY_PASSWORD environment variables when producing a private build
# (set the path and the credentials together - they must belong to one JKS).
ESP32_FLASHER_STORE_PASSWORD=esp32flasher
ESP32_FLASHER_KEY_ALIAS=esp32-flasher
ESP32_FLASHER_KEY_PASSWORD=esp32flasher
