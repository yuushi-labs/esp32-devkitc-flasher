# Fixed distribution signing key for esp32-devkitc-flasher.
#
# The keystore in this directory is intentionally published so that every
# release build is signed with the same key and users can upgrade in place.
# Override these values with the ESP32_FLASHER_STORE_PASSWORD /
# ESP32_FLASHER_KEY_ALIAS / ESP32_FLASHER_KEY_PASSWORD environment variables
# when producing a private build.
ESP32_FLASHER_STORE_PASSWORD=esp32flasher
ESP32_FLASHER_KEY_ALIAS=esp32-flasher
ESP32_FLASHER_KEY_PASSWORD=esp32flasher
